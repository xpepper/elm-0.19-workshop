<!DOCTYPE html>
<html>

<head>
  <meta charset="UTF-8">
  <title>Random Number Generator</title>
  <style>
    body {
      font-family: sans-serif;
      text-align: center;
      padding-top: 50px;
      background-color: #f5f5f5;
    }

    #elm {
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 20px;
    }

    button {
      padding: 10px 20px;
      font-size: 16px;
      cursor: pointer;
    }

  <script src="elm.js"></script>

    var app = Elm.Main.init({ node: document.getElementById("elm") });

</html>
